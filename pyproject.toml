[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneglow-ha"
version = "1.0.0"
description = "Home Assistant integration for SceneGlow"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "AIGenuity LTD" }]

[project.optional-dependencies]
test = [
  "homeassistant>=2025.11.2,<2026.9.0",
  "pytest>=8.4.0",
  "pytest-aiohttp>=1.1.0",
  "pytest-cov>=6.2.0",
  "pytest-homeassistant-custom-component>=0.13.250",
]
dev = [
  "sceneglow-ha[test]",
  "mypy>=1.17.0",
  "ruff>=0.12.0",
]

[tool.setuptools.packages.find]
include = ["custom_components.sceneglow*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.sceneglow" = [
  "brand/*.png",
  "manifest.json",
  "translations/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components.sceneglow"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PT", "RUF", "SIM", "UP"]
ignore = [
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
